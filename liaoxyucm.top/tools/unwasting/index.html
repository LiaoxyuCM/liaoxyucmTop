<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="http://assets.liaoxyucm.top/v2.css">
		<link rel="shortcut icon" href="https://assets.liaoxyucm.top/favicon.ico">
		<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
		<script src="/unwasting/module.js"></script>
		<title>Unwasting | LiaoxyuCM</title>
	</head>
	<body>
		<nav>
			<a href="https://liaoxyucm.top">LiaoxyuCM</a>
			<div class="pc">
				<a href="https://github.com/LiaoxyuCM" target="_blank">GitHub</a>
				<a href="https://liaoxyucm.top/friendlinks">友链</a>
			</div>
		</nav>
		<main>
			<noscript>
				<h3>Unwasting无法运作 因为你没打开JavaScript</h3>
			</noscript>
			<textarea placeholder="输入文本" id="input"></textarea>
			<label for="uniquers">
				<p>
					<input type="checkbox" id="uniquers" checked />
					自动初始化
				</p>
			</label>
			<div style="display: flex">
				<div class="buttongroup" style="flex: 1">
					<button class="go">编译成wastelang</button>
					<button class="copyrs">复制结果</button>
				</div>
				<p>结果=<span class="restat_len">0</span>ch, 原文本/结果&approxeq;<span class="restat_dv">undef</span></p>
			</div>
			<textarea placeholder="结果将显示在这里&#10;新版Unwasting编译结果的长度 比 初版的 压缩了大约10%&#10;但由于代码稳定性, 编译器舍去了众多WasteLang的功能, 从而编译后的文本不是最短的 (虽然我们已做到尽可能短)" id="output" style="word-break:break-all;line-break:anywhere" readonly></textarea>
		</main>
		<footer>
			<p>&copy; LiaoxyuCM × FrontMeteor 2024-2026</p>
		</footer>
		<script>
			const output = $('#output');
			$(".go").on("click", () => {
				output.val(unwaste_compile($("#input").val(), $("#uniquers").checked));
				$(".restat_len").text(output.val().length);
				$(".restat_dv").text(Math.floor(output.val().length / $("#input").val().length * 100) / 100);
			})

			$(".copyrs").on("click", async () => {
				await navigator.clipboard.writeText(output.val());
			})
		</script>
	</body>
</html>
