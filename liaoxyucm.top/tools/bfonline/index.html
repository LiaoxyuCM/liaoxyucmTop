<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="https://newsite.liaoxyucm.top/style.css">
		<link rel="shortcut icon" href="https://assets.liaoxyucm.top/favicon.ico">
		<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
		<script src="/bfonline/bf.js"></script>
		<title>Bfonline | LiaoxyuCM</title>
	</head>
	<body>
		<nav>
			<a href="https://liaoxyucm.top">LiaoxyuCM</a>
			<div class="pc">
				<a href="https://github.com/LiaoxyuCM" target="_blank">GitHub</a>
				<a href="https://liaoxyucm.top/friendlylinks">友链</a>
			</div>
		</nav>
		<main>
			<noscript>
				<h3>BFEX无法运作 因为你没打开JavaScript</h3>
			</noscript>
			<textarea placeholder="代码" id="i_code"></textarea>
			<textarea placeholder="输入数据" id="i_data" style="height:100px"></textarea>
			<select id="processor">
				<option value="donothing">不使用预处理器</option>
				<option value="macro_comment_process">宏和注释预处理器(beta)</option>
			</select>
			<div style="display: flex">
				<div class="buttongroup" style="flex: 1">
					<button class="go">开始</button>
					<button class="copyrs">复制结果</button>
				</div>
			</div>
			<textarea placeholder="结果将显示在这里" id="output" readonly></textarea>
		</main>
		<section class="footer">
			<p>&copy; LiaoxyuCM × FrontMeteor 2024-2026</p>
		</section>
		<script>
			const output = $('#output');
			$(".go").on("click", () => {
				const [success, value] = bf_compile($("#i_code").val(), $("#i_data").val(), processor[$("#processor").val()]);
				output.val(value);
				output.css({color: success?"":"#f00"});
			})

			$(".copyrs").on("click", async () => {
				await navigator.clipboard.writeText(output.val());
			})
		</script>
	</body>
</html>
