<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<title>IVisitable</title>
	<link rel="stylesheet" href="/ssdotide/ivisitable/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="https://assets.liaoxyucm.top/favicon.ico">
</head>
<body>
	<div class="pare">
		<div class="section_1">
			<div></div>
		</div>
		<div class="section_2">
			<button outline class="create-ssdot">创建ssdot实例/New ssdot instance</button>
			<a href="api_doc.html" target="_blank">API接口文档</a>
		</div>
	</div>
	<script>
class Ssdot{constructor(){this.a="";this.b=0}run(h){let f="";const c={".":[()=>{f+=this.a+"\n";this.a=""},()=>{this.a+=".";this.b=0},()=>{}],"\\":[()=>{this.b=1},()=>{this.a+="\\";this.b=0},()=>{}],"/":[()=>{this.b=2},()=>{this.a+="/";this.b=0},()=>{this.b=0}],g:[(d)=>{this.a+=d},(d)=>{this.a+=d;this.b=0},(_)=>{}]};h.split("").forEach((e)=>{switch(e){case".":case"\\":case"/":c[e][this.b]();break;default:c.g[this.b](e);break}});return f}}

////////////MAIN/////////////
	var executors = [];
	var id = 0;
	function ssdotexec(iden) {
		const elem = document.querySelector(`div.section_1 div div[data-id='${iden}']`);
		const code = prompt("输入代码/Enter code");
		const result = executors[iden].run(code).replace(/&/g, "&amp;").replace(/>/g, "&gt;").replace(/</g, "&lt;").replace(/'/g, "&quot;").replace(/\n/g, "<br>");
		elem.innerHTML = `
			<p>Ssdot #${iden}<button onclick="ssdotexec(${iden})">运行/Execute</button><button onclick="deleteitem(${iden})">删除/Delete</button></p>
			<p>数据/Data:</p>
			<ul>
				<li><p>输出/output = ${result}</p></li>
				<li><p>残留/residue = ${executors[iden].a.replace(/&/g, "&amp;").replace(/>/g, "&gt;").replace(/</g, "&lt;").replace(/'/g, "&quot;").replace(/\n/g, "<br>")}</p></li>
				<li><p>状态/status = ${executors[iden].b}</p></li>
			</ul>
		`;
	}
	function deleteitem(iden) {
		var elem = document.querySelector(`div.section_1 div div[data-id='${iden}']`);
		var parent = document.querySelector(`div.section_1 div`);
		parent.removeChild(elem);
	}
	document.querySelector(".create-ssdot").addEventListener("click", () => {
		executors.push(new Ssdot());
		var elem = document.createElement("div");
		elem.setAttribute("bordered", "");
		elem.setAttribute("data-id", id);
		elem.innerHTML = `
			<p>Ssdot #${id}<button onclick="ssdotexec(${id})">运行/Execute</button><button onclick="deleteitem(${id})">删除/Delete</button></p>
			<p>数据/Data:</p>
			<ul>
				<li><p>输出/output =</p></li>
				<li><p>残留/residue =</p></li>
				<li><p>状态/status = 0</p></li>
			</ul>
		`;
		document.querySelector(".section_1 div").appendChild(elem);
		id++;
	});
	</script>
</body>
</html>
