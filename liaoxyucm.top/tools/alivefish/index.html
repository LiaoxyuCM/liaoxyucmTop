<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="https://newsite.liaoxyucm.top/style.css">
		<link rel="shortcut icon" href="https://assets.liaoxyucm.top/favicon.ico">
		<title>Alivefish | LiaoxyuCM</title>
	</head>
	<body>
		<nav>
			<a href="https://liaoxyucm.top">LiaoxyuCM</a>
			<div class="pc">
				<a href="https://github.com/LiaoxyuCM" target="_blank">GitHub</a>
				<a href="https://liaoxyucm.top/friendlylinks">友链</a>
			</div>
		</nav>
		<main>
			<noscript>
				<h3>Alivefish无法运作 因为你没打开JavaScript</h3>
			</noscript>
			<textarea placeholder="输入文本" class="input"></textarea>
			<div class="buttongroup">
				<button class="go">编译成deadfish</button>
				<button class="copyrs">复制结果</button>
			</div>
			<textarea placeholder="alivefish, 用于将文本转换成deadfish代码, 见https://esolangs.org/wiki/Deadfish" class="output" style="word-break:break-all;line-break:anywhere" readonly></textarea>
		</main>
		<section class="footer">
			<p>&copy; LiaoxyuCM × FrontMeteor 2024-2026</p>
		</section>
		<script type="module">
			import alivefish_impl from "/alivefish/module.js";

			const input = document.querySelector('.input');
			const output = document.querySelector('.output');
			const go = document.querySelector('.go');
			go.addEventListener("click", () => {
				output.value = alivefish_impl(input.value);
			})

			const copy_result = document.querySelector('.copyrs');
			copy_result.addEventListener("click", async () => {
				await navigator.clipboard.writeText(output.value);
			})
		</script>
	</body>
</html>
